name: "CI — Verify TypeScript & Rust Core"

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  frontend-check:
    name: "Frontend TypeScript & Vite Build"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: TypeScript Strict Check (tsc --noEmit)
        run: npm run lint

      - name: Production Frontend Build
        run: npm run build

  rust-core-check:
    name: "Rust Core Check (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure Tauri v2 Icons, Capabilities & Dist Assets
        run: node scripts/ensure-tauri-assets.mjs

      - name: Install Linux WebKitGTK & System Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Rust Stable Toolchain (1.81+)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry & Target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cargo Check Tauri v2 Backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
